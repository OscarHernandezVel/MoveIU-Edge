[project]
name = "bus-edge"
version = "0.1.0"
description = "Agente a bordo de la maqueta: contador de puertas, cámaras, GPS y telemetría"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108", "S311"]
"src/bus_edge/doors/link.py" = ["S311"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["bus_edge"]
ignore_missing_imports = true
